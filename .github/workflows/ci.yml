name: CI
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck bats shfmt
      - name: Format (shfmt)
        run: shfmt -d -i 2 -ci -sr bin/ssg lib/*.sh scripts/*.sh completions/ssg.bash tests/helpers.bash
      - name: Lint (shellcheck)
        run: shellcheck -x -e SC1090 -e SC1091 bin/ssg lib/*.sh scripts/*.sh completions/ssg.bash
      - name: Tests (bats)
        run: bats -r tests

  # the generator must work against old and new bash/systemd userlands
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -y && sudo apt-get install -y bats
      - run: bats -r tests
      - name: Smoke test
        run: |
          bin/ssg doctor || true
          bin/ssg new --stdout --exec /bin/true --name smoke --harden strict
